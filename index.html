.onb{display:inline-flex;align-items:center;gap:7px;border-radius:20px;padding:4px 12px;font-weight:700;font-size:12px;white-space:nowrap;background:#e8edf0;color:#6b7b85}.onb:before{content:"";width:8px;height:8px;border-radius:50%;background:#a3b0b8}
.onb.on{background:#17a34a;color:#fff}.onb.on:before{background:#fff;box-shadow:0 0 0 3px #ffffff55}
@media(max-width:900px){#app{display:block}.side{display:none}.top{padding:0 14px}.wrap{padding:16px 12px 60px}.g2{grid-template-columns:1fr}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:64px;z-index:30}.tabs button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 14px;font-weight:700;white-space:nowrap;color:#46606c}.tabs button.on{background:var(--navy);border-color:var(--navy);color:#fff}
#mail{display:none}}
@media(max-width:520px){.k3{grid-template-columns:1fr}.two,.row2{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut,setPersistence,browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore,collection,doc,getDoc,getDocs,addDoc,setDoc,updateDoc,deleteDoc,query,where,limit,serverTimestamp,writeBatch,runTransaction,onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
let pushStatus=async()=>"unsupported",enablePush=async()=>"error",refreshPush=async()=>{},disablePush=async()=>{},onForeground=()=>{},showLocal=async()=>false;
let pushOK=true;
try{({pushStatus,enablePush,refreshPush,disablePush,onForeground,showLocal}=await import("./push.js"))}catch(e){pushOK=false;console.warn("push.js introuvable, alertes désactivées :",e)}

const firebaseConfig={apiKey:"AIzaSyA_iq7zGnD4100DM06D9sXgMjbCwfqq3JU",authDomain:"sorevia-bank.firebaseapp.com",projectId:"sorevia-bank",storageBucket:"sorevia-bank.firebasestorage.app",messagingSenderId:"729316261396",appId:"1:729316261396:web:bfeebed60e968c65433101",measurementId:"G-HF074LQR8Y"};
const auth=getAuth(initializeApp(firebaseConfig)),db=getFirestore(auth.app);
setPersistence(auth,browserLocalPersistence).catch(e=>console.warn("Persistance :",e));

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=(v,c="XOF")=>new Intl.NumberFormat("fr-FR",{maximumFractionDigits:0}).format(Number(v)||0)+" "+c;
const fd=t=>t?.toDate?t.toDate().toLocaleString("fr-FR"):"—";
const tms=t=>t?.toMillis?t.toMillis():0;
const ic=n=>`<svg class="i"><use href="#i-${n}"/></svg>`;
const cp=t=>`<button class="cp" data-copy="${esc(t)}" aria-label="Copier" title="Copier">${ic("copy")}</button>`;
const uname=u=>u?(((u.prenom||"")+" "+(u.nom||"")).trim()||"Sans nom"):"Utilisateur supprimé";
const ini=u=>(((u?.prenom||"").charAt(0)+(u?.nom||"").charAt(0))||"?").toUpperCase();
const TL={deposit:"Dépôt",transfer:"Transfert",savings:"Épargne",loan:"Emprunt",card:"Carte",adjustment:"Ajustement",repayment:"Remboursement"};
const RATE=0.05;
const dstr=()=>new Date().toLocaleString("fr-FR");
const FL={balance:"compte principal",savingsBalance:"compte épargne",cardBalance:"carte"};
const TT={dashboard:"Tableau de bord",users:"Utilisateurs",tx:"Transactions",req:"Demandes",notif:"Notifications",logs:"Journal d'activité"};
const isPend=s=>/attente/i.test(s||"");
const pill=s=>`<span class="st ${isPend(s)?"pend":/rejet|annul/i.test(s||"")?"bad":"ok"}">${esc(s||"—")}</span>`;

let me=null,view="dashboard",S={users:[],tx:[],dr:[],lr:[],logs:[],closed:[]},F={uq:"",tq:"",tt:"all",ts:"all",rt:"dep",nu:"all"};
const uById=id=>S.users.find(u=>u.id===id);
const uMail=id=>uById(id)?.email||"";

function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove("show"),3200)}
function copy(t){(navigator.clipboard?.writeText(t)||Promise.reject()).then(()=>toast("Copié : "+(t.length>28?t.slice(0,26)+"…":t)),()=>{const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");toast("Copié")}catch(e){toast("Copie impossible")}a.remove()})}
const modal=h=>{$("mbody").innerHTML=h;$("modal").classList.remove("hidden")};
const closeM=()=>$("modal").classList.add("hidden");
function csv(rows,name){const t="\ufeff"+rows.map(r=>r.map(c=>'"'+String(c??"").replace(/"/g,'""')+'"').join(";")).join("\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/csv;charset=utf-8"}));a.download=name;document.body.appendChild(a);a.click();a.remove()}

/* ---------- Données ---------- */
const mapDocs=s=>s.docs.map(d=>({id:d.id,...d.data()}));
async function loadAll(){
const [u,t,d,l,z]=await Promise.all([getDocs(collection(db,"users")),getDocs(query(collection(db,"transactions"),limit(1500))),getDocs(collection(db,"depositRequests")),getDocs(collection(db,"loanRequests")),getDocs(collection(db,"closedUsers")).catch(()=>({docs:[]}))]);
S.users=mapDocs(u).sort((a,b)=>uname(a).localeCompare(uname(b)));
const by=(a,b)=>tms(b.createdAt)-tms(a.createdAt);
S.tx=mapDocs(t).sort(by);S.dr=mapDocs(d).sort(by);S.lr=mapDocs(l).sort(by);S.closed=mapDocs(z).sort((a,b)=>tms(b.closedAt)-tms(a.closedAt));
}
async function log(action,detail){try{await addDoc(collection(db,"adminLogs"),{adminUid:me.uid,adminEmail:me.email,action,detail:String(detail||""),createdAt:serverTimestamp()})}catch(e){console.warn("Journal :",e)}}
const notify=(uid,title,message)=>addDoc(collection(db,"notifications"),{uid,title,message,read:false,createdAt:serverTimestamp()});
async function delMany(refs){for(let i=0;i<refs.length;i+=400){const b=writeBatch(db);refs.slice(i,i+400).forEach(r=>b.delete(r));await b.commit()}}
async function bump(uid,field,delta,abs){
const ref=doc(db,"users",uid),d=(await getDoc(ref)).data(),cur=Number(d[field])||0,nv=abs!==undefined?abs:cur+delta;
if(nv<0)throw new Error("Solde insuffisant : le solde ne peut pas être négatif.");
await updateDoc(ref,{[field]:nv});return{cur,nv,d};
}
function addM(d,k){const x=new Date(d);x.setMonth(x.getMonth()+k);return x}
function lateMonths(due){let k=0;while(k<600&&addM(due,k+1)<=new Date())k++;return k}
async function accrueUser(u){
const c=u.devise||"XOF";
const out=await runTransaction(db,async tr=>{
const r=doc(db,"users",u.id),d=(await tr.get(r)).data(),dn=d.loanPenaltyCount||0;
if(!(d.loanBalance<0)||!d.loanDueAt?.toDate)return null;
const nn=lateMonths(d.loanDueAt.toDate());if(nn<=dn)return null;
const per=Math.round((d.loanPrincipal||0)*RATE);
tr.update(r,{loanBalance:d.loanBalance-per*(nn-dn),loanPenaltyCount:nn});
return{per,dn,nn,bal:d.loanBalance,due:d.loanDueAt.toDate()};
});
if(!out)return 0;
let b=out.bal;
for(let k=out.dn+1;k<=out.nn;k++){b-=out.per;
await notify(u.id,"Emprunt en retard : pénalité du mois "+k,["Pénalité n° : "+k,"Montant ajouté : + "+money(out.per,c)+" ("+(RATE*100)+" % du capital)","Nouveau solde de l'emprunt : − "+money(-b,c),"Échéance initiale : "+out.due.toLocaleDateString("fr-FR"),"Date : "+dstr()].join("\n"));}
await log("Pénalité de retard",uname(u)+" — "+(out.nn-out.dn)+" mois, solde "+money(b,c));
return out.nn-out.dn;
}

async function decide(kind,id,ok){
const dep=kind==="dep",r=(dep?S.dr:S.lr).find(x=>x.id===id),status=ok?(dep?"Effectué":"Approuvé"):"Rejeté",patch={status},c=r.currency||"XOF",what=dep?"dépôt":"emprunt";
const rows=[["Référence",r.reference||id.slice(0,10).toUpperCase()],["Opération",dep?"Dépôt":"Emprunt"],["Montant",money(r.amount,c)]];
if(ok&&dep&&!r.credited){const x=await bump(r.uid,"balance",Number(r.amount)||0);patch.credited=true;rows.push(["Montant crédité",money(r.amount,c)],["Nouveau solde du compte principal",money(x.nv,c)])}
if(ok&&!dep&&!r.credited){
const u=uById(r.uid);if((Number(u?.loanBalance)||0)<0)throw new Error("Ce client a déjà un emprunt en cours.");
const n=Number(r.durationMonths)||1,cap=Number(r.amount)||0,interest=Math.round(cap*RATE*n),total=cap+interest,due=addM(new Date(),n);
const x=await bump(r.uid,"balance",cap);
await updateDoc(doc(db,"users",r.uid),{loanBalance:-total,loanPrincipal:cap,loanMonths:n,loanTotal:total,loanApprovedAt:new Date(),loanDueAt:due,loanPenaltyCount:0});
patch.credited=true;
rows.push(["Durée",n+" mois"],["Intérêts ("+(RATE*100)+" % × "+n+" mois)",money(interest,c)],["Capital crédité",money(cap,c)],["Nouveau solde du compte principal",money(x.nv,c)],["Solde de l'emprunt","− "+money(total,c)],["Échéance",due.toLocaleDateString("fr-FR")],["Pénalité après échéance",(RATE*100)+" % du capital par mois ("+money(Math.round(cap*RATE),c)+")"]);
}
await updateDoc(doc(db,dep?"depositRequests":"loanRequests",id),patch);
const t=dep?S.tx.find(x=>x.requestId===id):S.tx.find(x=>x.type==="loan"&&x.uid===r.uid&&x.amount===r.amount&&x.durationMonths===r.durationMonths&&isPend(x.status));
if(t)await updateDoc(doc(db,"transactions",t.id),ok&&!dep?{status,direction:"credit"}:{status});
rows.push(["Statut",status],["Date",dstr()]);
await notify(r.uid,ok?(dep?"Dépôt accepté":"Emprunt approuvé"):"Demande refusée",rows.map(([k,v])=>k+" : "+v).join("\n"));
await log(ok?"Demande approuvée":"Demande rejetée",what+" "+money(r.amount,c)+" — "+uname(uById(r.uid)));
}

edittx:id=>txModal(id),
rt:id=>{F.rt=id;rReq()},
deltx:async id=>{if(await askYN("Supprimer cette opération de l'historique ?"))run(async()=>{await deleteDoc(doc(db,"transactions",id));await log("Opération supprimée",id)},"Opération supprimée")},
delsel:async()=>{const ids=[...document.querySelectorAll(".sel:checked")].map(x=>x.value);if(!ids.length)return toast("Sélectionnez au moins une opération.");if(await askYN("Supprimer "+ids.length+" opération(s) ? Action définitive."))run(async()=>{await delMany(ids.map(i=>doc(db,"transactions",i)));await log("Suppression multiple",ids.length+" opérations")},"Opérations supprimées")},
delhist:async id=>{const u=uById(id);if(await askYN("Supprimer tout l'historique de "+uname(u)+" ? Action définitive."))run(async()=>{const s=await getDocs(query(collection(db,"transactions"),where("uid","==",id)));await delMany(s.docs.map(d=>d.ref));await log("Historique supprimé",uname(u)+" ("+s.size+" opérations)");closeM()},"Historique supprimé")},
delreq:async id=>{if(await askYN("Supprimer cette demande ?"))run(async()=>{await deleteDoc(doc(db,F.rt==="dep"?"depositRequests":"loanRequests",id));await log("Demande supprimée",id)},"Demande supprimée")},
ok:id=>{if(confirm(F.rt==="dep"?"Approuver et créditer le compte du client ?":"Approuver cet emprunt et créditer le capital sur le compte principal du client ?"))run(()=>decide(F.rt,id,true),"Demande approuvée")},
no:id=>{if(confirm("Rejeter cette demande ?"))run(()=>decide(F.rt,id,false),"Demande rejetée")},
gotx:id=>{const u=uById(id);F.tq=u.email||id;F.tt="all";F.ts="all";closeM();view="tx";render()},
gonotif:id=>{F.nu=id;closeM();view="notif";render()},
togglecard:id=>{const u=uById(id),on=!u.cardActivated;run(async()=>{await updateDoc(doc(db,"users",id),{cardActivated:on});await log(on?"Carte activée":"Carte désactivée",uname(u));closeM()},on?"Carte activée":"Carte désactivée")},
savebal:id=>{
const f=$("m-field").value,mode=$("m-mode").value,amt=Math.round(Number($("m-amount").value)),note=$("m-note").value.trim(),nt=$("m-notif").checked;
if(!(amt>=0)||$("m-amount").value==="")return toast("Saisissez un montant valide.");
if(mode!=="set"&&amt<=0)return toast("Le montant doit être supérieur à 0.");
run(async()=>{
const r=await bump(id,f,mode==="credit"?amt:-amt,mode==="set"?amt:undefined),delta=r.nv-r.cur,c=r.d.devise||"XOF";
if(delta!==0){
await addDoc(collection(db,"transactions"),{uid:id,type:"adjustment",direction:delta>0?"credit":"debit",amount:Math.abs(delta),currency:c,status:"Effectué",description:note||"Ajustement du "+FL[f]+" par l'administration",createdAt:serverTimestamp()});
if(nt)await notify(id,"Mise à jour de votre solde",["Référence : ADM-"+Date.now().toString(36).toUpperCase(),"Opération : "+(delta>0?"Crédit":"Débit")+" par l'administration","Compte : "+FL[f],"Montant : "+(delta>0?"+ ":"− ")+money(Math.abs(delta),c),"Ancien solde : "+money(r.cur,c),"Nouveau solde : "+money(r.nv,c),note?"Libellé : "+note:"","Date : "+dstr()].filter(Boolean).join("\n"));
}
await log("Solde modifié",uname(uById(id))+" — "+FL[f]+" : "+money(r.cur,c)+" → "+money(r.nv,c));closeM();
},"Solde mis à jour");
},
savetx:id=>{
const t=S.tx.find(x=>x.id===id),amount=Math.round(Number($("e-amount").value)),status=$("e-status").value;
if(!(amount>=0))return toast("Montant invalide.");
const patch={amount,status,description:$("e-desc").value.trim()};
if(t.type==="transfer"){Object.assign(patch,{beneficiaryName:$("e-bn").value.trim(),beneficiaryIban:$("e-iban").value.trim(),beneficiaryBic:$("e-bic").value.trim(),executionDate:$("e-date").value.trim()})}
const deb=$("e-debit")?.checked,nt=$("e-notif").checked;
run(async()=>{
if(t.type==="transfer"&&status==="Effectué"&&!t.debited&&deb){await bump(t.uid,"balance",-amount);patch.debited=true}
await updateDoc(doc(db,"transactions",id),patch);
if(nt&&status!==t.status)await notify(t.uid,"Mise à jour de votre "+(TL[t.type]||"opération").toLowerCase(),["Référence : "+(t.reference||t.id.slice(0,10).toUpperCase()),"Type : "+(TL[t.type]||"Opération"),"Montant : "+money(amount,t.currency),t.beneficiaryName?"Bénéficiaire : "+t.beneficiaryName:"",patch.debited&&!t.debited?"Montant débité de votre compte principal : "+money(amount,t.currency):"","Ancien statut : "+t.status,"Nouveau statut : "+status,"Date : "+dstr()].filter(Boolean).join("\n"));
await log("Opération modifiée",(TL[t.type]||"")+" "+money(amount,t.currency)+" — "+uname(uById(t.uid))+" ("+status+")");closeM();
},"Opération modifiée");
},
sendnotif:()=>{
const to=$("nu").value,title=$("nt").value.trim(),msg=$("nm").value.trim();
if(!title||!msg)return toast("Renseignez le titre et le message.");
if(to==="all"&&!confirm("Envoyer ce message aux "+S.users.length+" clients ?"))return;
run(async()=>{const ids=to==="all"?S.users.map(u=>u.id):[to];for(let i=0;i<ids.length;i+=400){const b=writeBatch(db);ids.slice(i,i+400).forEach(uid=>b.set(doc(collection(db,"notifications")),{uid,title,message:msg,read:false,createdAt:serverTimestamp()}));await b.commit()}
await log("Notification envoyée",(to==="all"?"Tous les clients":uname(uById(to)))+" — "+title)},"Notification envoyée");
},
toggleacc:id=>{const u=uById(id),off=!u.disabled;if(confirm((off?"Désactiver":"Réactiver")+" le compte de "+uname(u)+" ?"+(off?"\nLe client ne pourra plus utiliser son espace ni effectuer d'opérations.":"")))run(async()=>{await setDisabled([id],off);closeM()},off?"Compte désactivé":"Compte réactivé")},
delacc:async id=>{
if(id===me.uid)return toast("Vous ne pouvez pas supprimer votre propre compte.");
const u=uById(id);if(!await askYN("Supprimer définitivement le compte de "+uname(u)+" et toutes ses données ?\nCette action est définitive."))return toast("Suppression annulée.");
run(async()=>{await deleteAccount(id);closeM()},"Compte supprimé");
},
disusers:()=>{const ids=selUsers();if(!ids.length)return toast("Sélectionnez au moins un client.");if(confirm("Désactiver "+ids.length+" compte(s) ?"))run(()=>setDisabled(ids,true),ids.length+" compte(s) désactivé(s)")},
enusers:()=>{const ids=selUsers();if(!ids.length)return toast("Sélectionnez au moins un client.");if(confirm("Réactiver "+ids.length+" compte(s) ?"))run(()=>setDisabled(ids,false),ids.length+" compte(s) réactivé(s)")},
delusers:async()=>{const ids=selUsers().filter(i=>i!==me.uid);if(!ids.length)return toast("Sélectionnez au moins un client.");if(!await askYN("Supprimer définitivement "+ids.length+" compte(s) et toutes leurs données ?\nCette action est définitive."))return toast("Suppression annulée.");run(async()=>{for(const i of ids)await deleteAccount(i)},ids.length+" compte(s) supprimé(s)")},
exusers:()=>csv([["UID","Prénom","Nom","E-mail","Compte","Devise","Solde","Épargne","Carte","Téléphone","Pays","Ville"],...S.users.map(u=>[u.id,u.prenom,u.nom,u.email,u.accountNumber,u.devise,u.balance,u.savingsBalance,u.cardBalance,u.telephone,u.pays,u.ville])],"utilisateurs.csv"),
extx:()=>csv([["Date","UID","Client","Type","Montant","Devise","Statut","Description","Bénéficiaire","IBAN"],...txFilter().map(t=>[fd(t.createdAt),t.uid,uname(uById(t.uid)),TL[t.type]||t.type,t.amount,t.currency,t.status,t.description,t.beneficiaryName,t.beneficiaryIban])],"transactions.csv")
};
document.addEventListener("click",e=>{
const c=e.target.closest("[data-copy]");if(c)return copy(c.dataset.copy);
const v=e.target.closest("[data-v]");if(v){view=v.dataset.v;return render()}
const a=e.target.closest("[data-act]");if(a&&ACT[a.dataset.act])ACT[a.dataset.act](a.dataset.id,a);
});
$("modal").addEventListener("mousedown",e=>{if(e.target===$("modal"))closeM()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeM()});

/* ---------- Connexion ---------- */
const lerr=m=>{$("lErr").textContent=m;$("lErr").classList.toggle("hidden",!m)};
const showLogin=()=>{$("boot").classList.add("hidden");$("app").classList.add("hidden");$("login").classList.remove("hidden")};
async function doLogin(){
const b=$("lBtn");lerr("");b.disabled=true;b.textContent="Connexion…";
try{await signInWithEmailAndPassword(auth,$("lEmail").value.trim(),$("lPass").value)}
catch(e){console.error(e);lerr(/invalid|wrong|user-not-found/.test(e.code||"")?"E-mail ou mot de passe incorrect.":"Connexion impossible ("+(e.code||"erreur")+").")}
b.disabled=false;b.textContent="Se connecter";
}
$("lBtn").onclick=doLogin;$("lPass").addEventListener("keydown",e=>{if(e.key==="Enter")doLogin()});
/* ---------- Notifications push ---------- */
let fgOn=false;
async function paintPush(){
const st=await pushStatus(),on=st==="granted";
document.querySelectorAll(".pushbtn").forEach(b=>{b.classList.toggle("hidden",st==="unsupported");b.querySelector(".pushlbl").textContent=on?"Alertes activées":"Activer les alertes"});
const bar=$("pushBar"),msg=$("pushBarMsg"),bb=$("pushBarBtn");
if(!pushOK){bar.classList.remove("hidden");msg.textContent="Fichier push.js introuvable dans ce dépôt : les alertes sont impossibles.";bb.classList.add("hidden");return}
if(on||st==="unsupported"){bar.classList.add("hidden");return}
bar.classList.remove("hidden");bb.classList.remove("hidden");
if(st==="ios-install"){msg.textContent="iPhone : Partager > Sur l'écran d'accueil, puis ouvrez l'app depuis son icône.";bb.classList.add("hidden")}
else if(st==="denied"){msg.textContent="Notifications bloquées : autorisez-les dans les réglages du navigateur.";bb.classList.add("hidden")}
else msg.textContent="Recevez une alerte sur ce téléphone pour chaque inscription ou demande."
}
async function onPushClick(){
const st=await pushStatus();
if(st==="ios-install"){toast("iPhone : Partager > Sur l'écran d'accueil, puis ouvrez l'app depuis son icône.");return}
if(st==="denied"){toast("Notifications bloquées : autorisez-les dans les réglages du navigateur.");return}
await enablePush(auth.app,db,me.uid);
if(Notification.permission==="granted"){toast("Alertes activées sur cet appareil.");showLocal("Sorevia Admin","Les alertes sont activées.","./","test")}
else toast("Alertes non autorisées.");
await paintPush();
}
document.querySelectorAll(".pushbtn").forEach(b=>b.onclick=onPushClick);$("pushBarBtn").onclick=onPushClick;

let adminLive=false;
function startAdminLive(){
if(adminLive)return;adminLive=true;
const specs=[
["users","Nouvelle inscription",d=>((d.prenom||"")+" "+(d.nom||"")).trim()||d.email||"Nouveau client"],
["depositRequests","Nouvelle demande de dépôt",d=>uname(uById(d.uid))+" — "+money(d.amount,d.currency)],
["loanRequests","Nouvelle demande d'emprunt",d=>uname(uById(d.uid))+" — "+money(d.amount,d.currency)]];
specs.forEach(([col,title,fmt])=>{
let first=true;
onSnapshot(collection(db,col),snap=>{
if(first){first=false;return}
const add=snap.docChanges().filter(c=>c.type==="added");
if(!add.length)return;
add.slice(0,3).forEach(c=>{const body=fmt(c.doc.data());toast(title+" — "+body);showLocal(title,body,"./","adm-"+col+"-"+c.doc.id)});
loadAll().then(()=>{if(view==="dashboard"||view==="req")render()}).catch(()=>{});
},e=>console.warn("Écoute en direct :",col,e));
});
}

onAuthStateChanged(auth,async u=>{
if(!u){me=null;showLogin();return}
try{if(!(await getDoc(doc(db,"admins",u.uid))).exists()){await signOut(auth);lerr("Ce compte n'a pas les droits administrateur.");return}}
catch(e){await signOut(auth);lerr("Accès refusé ("+(e.code||"erreur")+").");return}
me=u;$("who").textContent=u.email;$("mail").textContent=u.email;
try{await loadAll();const n=await accrueAll();if(n){await loadAll();toast(n+" pénalité(s) de retard appliquée(s)")}}catch(e){console.error(e);toast("Chargement des données impossible ("+(e.code||"erreur")+")")}
$("boot").classList.add("hidden");$("login").classList.add("hidden");$("app").classList.remove("hidden");render();
clearInterval(window.pr);window.pr=setInterval(pollUsers,30000);
refreshPush(auth.app,db,u.uid).catch(()=>{});paintPush();startAdminLive();
if(!fgOn){fgOn=true;onForeground(auth.app,d=>toast((d.title||"Sorevia Admin")+(d.body?" — "+d.body:"")))}
});
</script>
